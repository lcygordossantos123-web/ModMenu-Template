name: Build Mod Menu

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar o NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Compilar com ndk-build
        working-directory: app/src/main/jni
        run: ndk-build NDK_LIBS_OUT=${{ github.workspace }}/libs

      - name: Enviar as libs compiladas
        uses: actions/upload-artifact@v4
        with:
          name: libs
          path: libs/
          if-no-files-found: error
